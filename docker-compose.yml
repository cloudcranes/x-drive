services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/cloudcranes/x-drive:latest}
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file: .env
    volumes:
      - ${RCLONE_CONFIG_HOST:?在 .env 里设置 RCLONE_CONFIG_HOST 指向 rclone.conf}:/config/rclone/rclone.conf:ro
      - ./data:/data
      - ./downloads:/downloads
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "--check"]
      interval: 120s
      timeout: 60s
      retries: 3
      start_period: 60s

  web:
    image: ${BOT_IMAGE:-ghcr.io/cloudcranes/x-drive:latest}
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.web"]
    env_file: .env
    environment:
      WEB_PORT: "8080"
    volumes:
      - ./data:/data:ro
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
