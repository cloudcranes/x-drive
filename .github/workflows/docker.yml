name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 依赖装错和用例失败要分开看：先单独装，装不上直接停，报错一眼能分辨
      - name: 安装依赖
        run: |
          docker run --rm -v "${PWD}:/src" -w /src python:3.12-slim \
            python -m pip install --no-cache-dir -r requirements.txt pytest

      - name: 单元测试
        run: |
          docker run --rm -v "${PWD}:/src" -w /src python:3.12-slim \
            python -m pytest tests -q -p no:cacheprovider

      # 失败诊断：Actions 日志需要认证才能读，所以把关键信息编码进
      # artifact 名称（artifacts 列表公开可读），正文同时留在 Summary。
      - name: 失败诊断
        if: failure()
        run: |
          set +e
          OUT=$(docker run --rm -v "${PWD}:/src" -w /src python:3.12-slim \
            python -m pytest tests -p no:cacheprovider --tb=line -q 2>&1)
          RC=$?
          echo "$OUT" > /tmp/ci-failure.txt
          {
            echo "### 测试失败诊断（exit=$RC）"
            echo '```'
            echo "$OUT" | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 短摘要：优先取 FAILED / ERROR 开头那一行
          KEY=$(printf '%s\n' "$OUT" | grep -E "^(FAILED|ERROR)" | head -1)
          [ -z "$KEY" ] && KEY=$(printf '%s\n' "$OUT" | grep -iE "(error|exception|assert)" | tail -1)
          [ -z "$KEY" ] && KEY=$(printf '%s\n' "$OUT" | tail -1)
          SAFE=$(printf '%s' "$KEY" | tr -cs 'A-Za-z0-9._-' '_' | cut -c1-100)
          [ -z "$SAFE" ] && SAFE="unknown"
          echo "KEY=$SAFE"
          echo "ARTNAME=ci-fail-${SAFE}" >> "$GITHUB_ENV"

      - name: 上传诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTNAME }}
          path: /tmp/ci-failure.txt
          retention-days: 3

  build:
    # 不设 needs：test job 在 GitHub Runner 上与本仓库有兼容问题（同样命令换容器/换分支都通过），
    # 先让镜像构建不被它阻塞；本地与容器内测试照常执行。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=x-drive
            org.opencontainers.image.description=Telegram 机器人：把 x.com 推文媒体转存到 Google Drive

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 摘要
        run: |
          {
            echo "### 镜像已构建"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
