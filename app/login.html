<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-drive · 登录</title>
<link rel="icon" href="data:,">
<style>
  /* 设计语言：纯黑底 + 细颗粒 + 青色光晕；8px 圆角、1px 白 10% 描边、等宽字体数字 */
  :root{
    --bg:#000; --panel:rgba(13,13,13,.85); --panel-2:rgba(26,26,26,.85);
    --ink:#f8fafc; --ink-2:#a3b0c2; --ink-3:#6b7c94;
    --line:rgba(255,255,255,.10);
    --cyan:#3ebaf4; --gold-line:rgba(251,219,163,.22); --pink:#ec4899;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); background:var(--bg); overflow:hidden;
    font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased;
  }

  .glow{position:fixed; z-index:0; pointer-events:none; border-radius:50%}
  .glow.a{width:720px;height:720px;left:54%;top:-260px;
    background:radial-gradient(circle,rgba(62,186,244,.20) 0%,rgba(62,186,244,0) 70%)}
  .glow.b{width:560px;height:560px;left:-180px;bottom:-260px;
    background:radial-gradient(circle,rgba(236,72,153,.12) 0%,rgba(236,72,153,0) 70%)}
  .grain{position:fixed; inset:0; z-index:0; opacity:.045; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

  .stage{position:relative; z-index:1; height:100%; display:grid; place-items:center; padding:22px}

  .card{
    width:min(430px,100%); border-radius:28px; border:1px solid var(--line);
    background:linear-gradient(135deg,rgba(26,26,26,.88) 0%,rgba(10,10,10,.94) 60%,rgba(13,13,13,.96) 100%);
    box-shadow:0 2px 8px -2px rgba(0,0,0,.7), 0 40px 80px -40px rgba(0,0,0,.95);
    padding:34px 34px 26px; position:relative; overflow:hidden;
    animation:in .45s cubic-bezier(.22,1,.36,1) both;
  }
  .card::before{
    content:""; position:absolute; width:340px; height:340px; right:-120px; top:-150px; border-radius:50%;
    background:radial-gradient(circle,rgba(62,186,244,.22) 0%,rgba(62,186,244,0) 70%); pointer-events:none;
  }
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--cyan); display:flex; align-items:center; gap:7px;
  }
  .eyebrow::before{content:""; width:5px;height:5px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px var(--cyan)}
  h1{
    font-size:30px; font-weight:800; letter-spacing:-.02em; margin:12px 0 8px; line-height:1.2;
    background:linear-gradient(120deg,#f8fafc 0%,#f8fafc 32%,var(--cyan) 52%,#f8fafc 72%,#f8fafc 100%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 7s linear infinite;
  }
  @keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}
  .desc{color:var(--ink-2); font-size:13.5px; margin:0 0 22px}

  label{display:block; font-size:11.5px; color:var(--ink-3); margin:0 0 7px;
    font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-family:var(--mono)}
  .field{position:relative; margin-bottom:14px}
  .field input{
    width:100%; padding:12px 14px; border-radius:8px; font-size:14px;
    border:1px solid var(--line); background:rgba(0,0,0,.55); color:var(--ink);
    outline:none; transition:border-color .16s, box-shadow .16s, background .16s;
    font-family:var(--sans);
  }
  .field input::placeholder{color:#4a5566}
  .field input:focus{
    border-color:rgba(62,186,244,.55); background:rgba(0,0,0,.8);
    box-shadow:0 0 0 3px rgba(62,186,244,.14), 0 0 22px -6px rgba(62,186,244,.6);
  }
  .field input:-webkit-autofill{-webkit-text-fill-color:var(--ink); -webkit-box-shadow:0 0 0 40px #0d0d0d inset}
  .toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:0; background:transparent; color:var(--ink-3); cursor:pointer;
    padding:7px; border-radius:6px; line-height:0; transition:color .16s,background .16s;
  }
  .toggle:hover{color:var(--ink); background:rgba(255,255,255,.06)}
  .toggle svg{width:16px;height:16px}

  .submit{
    width:100%; margin-top:6px; padding:12px 16px; border-radius:8px; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:700; letter-spacing:.01em; color:#f8fafc;
    border:1px solid rgba(62,186,244,.34);
    background:linear-gradient(135deg,rgba(62,186,244,.20) 0%,rgba(62,186,244,.06) 100%);
    transition:border-color .16s, box-shadow .16s, transform .1s;
    display:flex; align-items:center; justify-content:center; gap:9px;
  }
  .submit:hover{border-color:rgba(62,186,244,.6);
    box-shadow:0 0 26px -8px rgba(62,186,244,.7), inset 0 1px 0 rgba(255,255,255,.08)}
  .submit:active{transform:translateY(1px)}
  .submit[disabled]{cursor:progress; opacity:.8}
  .spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(248,250,252,.25);
    border-top-color:var(--cyan); animation:spin .7s linear infinite; display:none}
  .submit[disabled] .spin{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .err{display:none; margin:14px 0 0; padding:10px 12px; border-radius:8px; font-size:12.5px;
    color:#ffc2c2; background:rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.32)}
  .err.show{display:block; animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}

  .capsule{
    display:grid; grid-template-columns:repeat(3,1fr); margin-top:22px;
    border-radius:20px; padding:14px 6px; border:1px solid var(--gold-line);
    background:linear-gradient(135deg,rgba(26,26,26,.85) 0%,rgba(10,10,10,.9) 100%);
    box-shadow:0 0 18px -2px rgba(92,182,206,.32);
  }
  .metric{padding:0 10px; border-right:1px solid var(--line)}
  .metric:last-child{border-right:0}
  .metric b{display:block; font-family:var(--mono); font-size:21px; font-weight:800; letter-spacing:-.02em;
    color:var(--ink); line-height:1.25}
  .metric span{display:block; font-size:11px; color:var(--ink-3); letter-spacing:.05em; margin-top:2px}

  .foot{display:flex; justify-content:space-between; align-items:center; gap:12px;
    margin-top:20px; color:var(--ink-3); font-size:11.5px; font-family:var(--mono)}
  .foot kbd{padding:1px 6px; border-radius:5px; border:1px solid var(--line);
    background:rgba(255,255,255,.05); color:var(--ink-2); font-family:var(--mono); font-size:11px}

  @media(prefers-reduced-motion:reduce){h1,.card{animation:none}}
  @media(max-width:420px){.card{padding:26px 22px 20px} h1{font-size:25px}}
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div><div class="grain"></div>

<main class="stage">
  <form class="card" id="form" novalidate>
    <div class="eyebrow">Secure Console</div>
    <h1>x-drive 控制台</h1>
    <p class="desc">登录后查看已归档的推文媒体、运行状态与 Drive 链接。</p>

    <label for="u">账号</label>
    <div class="field">
      <input id="u" name="u" type="text" placeholder="输入账号" autocomplete="username"
             spellcheck="false" autocapitalize="off" required>
    </div>

    <label for="p">密码</label>
    <div class="field">
      <input id="p" name="p" type="password" placeholder="输入密码" autocomplete="current-password" required>
      <button class="toggle" id="toggle" type="button" aria-label="显示密码" title="显示密码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <button class="submit" id="go" type="submit">
      <span class="spin"></span><span id="goText">进入控制台</span>
    </button>

    <div class="err" id="err"></div>

    <div class="capsule">
      <div class="metric"><b id="m-arch">—</b><span>归档推文</span></div>
      <div class="metric"><b id="m-file">—</b><span>媒体文件</span></div>
      <div class="metric"><b id="m-state">在线</b><span>服务状态</span></div>
    </div>

    <div class="foot">
      <span>Telegram → Drive</span>
      <span><kbd>Enter</kbd> 登录</span>
    </div>
  </form>
</main>

<script>
const $ = id => document.getElementById(id);
const BASE = location.origin;
const form = $("form"), u = $("u"), p = $("p"), err = $("err"), go = $("go"), goText = $("goText");

function fail(msg){ err.textContent = msg; err.classList.remove("show"); void err.offsetWidth; err.classList.add("show"); }
function reset(t){ go.disabled = false; goText.textContent = t; }

$("toggle").addEventListener("click", () => { p.type = p.type === "password" ? "text" : "password"; });
p.addEventListener("keyup", e => {
  if (e.getModifierState && e.getModifierState("CapsLock")) fail("大写锁定已开启");
  else if (err.textContent === "大写锁定已开启") err.classList.remove("show");
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  err.classList.remove("show");
  if (!u.value.trim() || !p.value) return fail("请输入账号和密码");
  go.disabled = true; goText.textContent = "验证中…";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      cache: "no-store",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user: u.value.trim(), password: p.value})
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      goText.textContent = "登录成功";
      location.replace("/");
      return;
    }
    reset("进入控制台");
    if (res.status === 401) { fail(data.error || "账号或密码不正确"); p.select(); }
    else fail("服务返回 " + res.status + "，请稍后重试");
  } catch (e2) {
    reset("进入控制台");
    fail("无法连接服务：" + e2.message);
  }
});
// 未登录也能读的统计（只给计数，不含内容）
(async () => {
  try {
    const r = await fetch(BASE + "/api/health", {cache: "no-store"});
    if (!r.ok) return;
    const d = await r.json();
    $("m-state").textContent = d.parse ? "在线" : "离线";
    $("m-state").style.color = d.parse ? "" : "var(--violet)";
    if (typeof d.tasks === "number") $("m-arch").textContent = d.tasks;
    if (typeof d.files === "number") $("m-file").textContent = d.files;
  } catch (e) { /* 统计失败不影响登录 */ }
})();

u.focus();
</script>
</body>
</html>
