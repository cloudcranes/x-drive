<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-drive · 推文媒体转存 Drive</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#000; --panel:rgba(13,13,13,.85); --panel-2:rgba(26,26,26,.85);
    --line:rgba(255,255,255,.10); --line-2:rgba(251,219,163,.22);
    --text:#f8fafc; --muted:#a3b0c2; --dim:#6b7c94;
    --cyan:#3ebaf4; --red:#ef6a6a; --violet:#c9a3ff;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --sans:"Plus Jakarta Sans",-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
    --gap:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--text); background:var(--bg);
    background-image:
      radial-gradient(760px 460px at 86% -8%, rgba(62,186,244,.16), transparent 68%),
      radial-gradient(620px 420px at 4% 2%, rgba(236,72,153,.07), transparent 70%);
    background-attachment:fixed;
    font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased;
  }

  /* 顶栏 */
  header{
    position:sticky; top:0; z-index:20; backdrop-filter:blur(16px);
    background:rgba(0,0,0,.72); border-bottom:1px solid var(--line);
  }
  .bar{max-width:1440px; margin:0 auto; padding:12px 26px; display:flex; align-items:center; gap:16px}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:-.02em; font-size:17px}
  .brand .mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(62,186,244,.32),rgba(62,186,244,.10));
    border:1px solid rgba(62,186,244,.4)}
  .brand .mark svg{width:13px;height:13px;stroke:var(--cyan)}
  .brand i{font-style:normal; color:var(--cyan)}
  .badge{margin-left:auto; display:inline-flex; align-items:center; gap:7px; padding:5px 11px;
    border:1px solid var(--line); border-radius:999px; background:rgba(13,13,13,.85);
    font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}

  /* hero + 统计 */
  .hero{max-width:1440px; margin:0 auto; padding:34px 26px 0}
  .eyebrow{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--cyan); display:flex; align-items:center; gap:7px}
  .eyebrow::before{content:""; width:5px;height:5px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px var(--cyan)}
  h1{font-size:38px; letter-spacing:-.025em; margin:12px 0 8px; font-weight:800; line-height:1.15;
    background:linear-gradient(120deg,#f8fafc 0%,#f8fafc 34%,var(--cyan) 52%,#f8fafc 70%,#f8fafc 100%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 7s linear infinite}
  @keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}
  .desc{color:var(--muted); font-size:14px; margin:0 0 20px; max-width:640px}

  .capsule{display:inline-grid; grid-template-columns:repeat(4,auto); border-radius:20px; padding:14px 8px;
    border:1px solid var(--line-2); background:linear-gradient(135deg,rgba(26,26,26,.85),rgba(10,10,10,.9));
    box-shadow:0 0 18px -2px rgba(92,182,206,.28)}
  .metric{padding:0 22px; border-right:1px solid var(--line)}
  .metric:last-child{border-right:0}
  .metric b{display:block; font-family:var(--mono); font-size:22px; font-weight:800;
    letter-spacing:-.02em; line-height:1.25; font-variant-numeric:tabular-nums}
  .metric span{font-size:11px; color:var(--dim); letter-spacing:.05em}

  /* 瀑布流：CSS columns，卡片 break-inside:avoid 保证不被拆断 */
  .feed{max-width:1440px; margin:0 auto; padding:26px 26px 72px; column-gap:var(--gap); column-count:4}
  @media(max-width:1280px){.feed{column-count:3}}
  @media(max-width:900px){.feed{column-count:2}}
  @media(max-width:600px){.feed{column-count:1; padding:20px 14px 56px} .hero{padding:26px 14px 0}
    .bar{padding:10px 14px}}

  .card{break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
    margin:0 0 var(--gap); border:1px solid var(--line); border-radius:8px;
    background:rgba(13,13,13,.72); overflow:hidden;
    box-shadow:0 2px 8px -2px rgba(0,0,0,.7);
    transition:border-color .18s, box-shadow .18s, transform .18s}
  .card:hover{border-color:rgba(62,186,244,.45); transform:translateY(-2px);
    box-shadow:0 0 26px -8px rgba(62,186,244,.55)}
  .card-media{position:relative; background:#080808; line-height:0}
  .card-media img{width:100%; height:auto; display:block; object-fit:cover}
  .card-media .ph{width:100%; aspect-ratio:4/5; display:grid; place-items:center;
    color:#2a2f36; font-family:var(--mono); font-size:11px}
  /* 多图宫格：2 图左右分栏，3 图左大右两小，4 图四宫格 */
  .grid{display:grid; gap:2px; background:#0a0a0a}
  .grid.n2{grid-template-columns:1fr 1fr; aspect-ratio:16/10}
  .grid.n3{grid-template-columns:1.35fr 1fr; grid-template-rows:1fr 1fr; aspect-ratio:4/3}
  .grid.n4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; aspect-ratio:1}
  .grid .cell{position:relative; overflow:hidden; min-height:0}
  .grid.n3 .cell:first-child{grid-row:span 2}
  .grid img{width:100%; height:100%; object-fit:cover; display:block}
  .grid .ph{aspect-ratio:auto; height:100%}
  .cellplay{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
    background:rgba(0,0,0,.6); border:1px solid var(--line); color:#fff; font-size:10px}
  .badge-media{position:absolute; left:9px; top:9px; display:flex; gap:6px}
  .chip{font-family:var(--mono); font-size:10.5px; padding:3px 7px; border-radius:5px;
    background:rgba(0,0,0,.72); border:1px solid var(--line); color:var(--text); backdrop-filter:blur(6px)}
  .chip.img{color:var(--cyan); border-color:rgba(62,186,244,.4)}
  .chip.vid{color:var(--violet); border-color:rgba(201,163,255,.36)}
  .more{position:absolute; right:9px; bottom:9px; font-family:var(--mono); font-size:10.5px;
    padding:3px 7px; border-radius:5px; background:rgba(0,0,0,.72); border:1px solid var(--line);
    color:var(--muted)}

  .card-body{padding:12px 13px 13px}
  .who{display:flex; align-items:center; gap:7px; margin-bottom:7px; min-width:0}
  .avatar{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(62,186,244,.30),rgba(236,72,153,.22));
    border:1px solid var(--line); font-family:var(--mono); font-size:10px; font-weight:700; color:var(--text)}
  .who .name{font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who .handle{color:var(--dim); font-family:var(--mono); font-size:11px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .title{font-size:13.5px; color:var(--text); margin:0 0 10px; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .meta{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:10.5px; color:var(--dim)}
  .meta .sp{flex:1}
  .meta a{color:var(--cyan); text-decoration:none; font-weight:600}
  .meta a:hover{text-decoration:underline}

  .empty{max-width:1440px; margin:0 auto 60px; padding:34px 20px; color:var(--muted);
    border:1px dashed var(--line); border-radius:8px; text-align:center}
  footer{max-width:1440px; margin:0 auto; padding:0 26px 40px; color:var(--dim);
    font-family:var(--mono); font-size:11.5px; display:flex; justify-content:space-between;
    gap:14px; flex-wrap:wrap}

  @media(prefers-reduced-motion:reduce){h1{animation:none} .card{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v11"/><path d="m7.5 11.5 4.5 4 4.5-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </span>
      x-<i>drive</i>
    </div>
    <div class="badge"><span class="dot" id="dot"></span><span id="health">连接中…</span></div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">Archive Stream</div>
    <h1>推文媒体归档</h1>
    <p class="desc">发给 Telegram 机器人的每条 x.com 链接，图片与视频都会落到 Google Drive，这里按时间倒序铺开。</p>
    <div class="capsule">
      <div class="metric"><b id="s-tasks">0</b><span>归档推文</span></div>
      <div class="metric"><b id="s-images">0</b><span>图片</span></div>
      <div class="metric"><b id="s-videos">0</b><span>视频</span></div>
      <div class="metric"><b id="s-last">—</b><span>最近入库</span></div>
    </div>
  </section>

  <section class="feed" id="feed"></section>
  <div id="empty-slot"></div>
  <footer>
    <span>parse-video-py · rclone · python-telegram-bot</span>
    <span id="updated"></span>
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso.slice(0, 16).replace("T", " ");
  return d.toLocaleString("zh-CN", {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
};
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const initial = s => (s || "?").trim().charAt(0).toUpperCase() || "?";

/** 单个媒体 → <img>，代理失败回退直连原图，再失败显示占位 */
function mediaImg(item, alt) {
  const img = new Image();
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = alt || "";
  img.referrerPolicy = "no-referrer";
  let fallback = item.raw || "";
  img.addEventListener("error", () => {
    if (fallback) { const f = fallback; fallback = ""; img.src = f; return; }
    const ph = el("div", "ph", "预览不可用");
    img.replaceWith(ph);
  });
  img.src = item.thumb || item.raw || "";
  return img;
}

/** 一条推文 → 一张瀑布流卡片；多图时铺宫格，否则单图封面 */
function card(t) {
  const node = el("article", "card");
  const media = el("div", "card-media");
  const items = (t.media || []).filter(m => m.thumb || m.raw);
  const cover = items[0];

  if (cover) {
    if (items.length === 1) {
      media.append(mediaImg(cover, t.title || t.id));
    } else {
      const grid = el("div", "grid n" + Math.min(items.length, 4));
      for (const item of items.slice(0, 4)) {
        const cell = el("div", "cell");
        cell.append(mediaImg(item, t.title || t.id));
        if (item.kind === "video") cell.append(el("span", "cellplay", "▶"));
        grid.append(cell);
      }
      media.append(grid);
    }
  } else {
    media.append(el("div", "ph", "无预览"));
  }

  const badges = el("div", "badge-media");
  if (t.images) badges.append(el("span", "chip img", t.images + " 图"));
  if (t.videos) badges.append(el("span", "chip vid", t.videos + " 视频"));
  if (badges.childElementCount) media.append(badges);
  if (items.length > 4) media.append(el("span", "more", "+" + (items.length - 4)));
  else if (items.length === 1 && cover.kind === "video") media.append(el("span", "more", "▶ 视频"));
  node.append(media);

  const body = el("div", "card-body");
  const who = el("div", "who");
  who.append(el("span", "avatar", initial(t.author)));
  who.append(el("span", "name", t.author || "未知作者"));
  if (t.handle) who.append(el("span", "handle", "@" + t.handle));
  body.append(who);

  const title = (t.title || "").replace(/https?:\/\/t\.co\/\S+/g, "").trim();
  if (title) body.append(el("p", "title", title));

  const meta = el("div", "meta");
  meta.append(el("span", null, fmt(t.at)));
  meta.append(el("span", "sp"));
  if (t.url) {
    const src = el("a", null, "原推 →");
    src.href = t.url; src.target = "_blank"; src.rel = "noopener";
    meta.append(src);
  }
  if (t.link) {
    const drv = el("a", null, "Drive ↗");
    drv.href = t.link; drv.target = "_blank"; drv.rel = "noopener";
    meta.append(drv);
  }
  body.append(meta);
  node.append(body);
  return node;
}

async function load() {
  try {
    const r = await fetch("/api/tasks", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    $("dot").className = d.health.parse ? "dot" : "dot off";
    $("health").textContent = d.health.parse ? "运行中 · parse 在线" : "parse 不可达";
    $("s-tasks").textContent = d.stats.tasks;
    $("s-images").textContent = d.stats.images;
    $("s-videos").textContent = d.stats.videos;
    $("s-last").textContent = d.stats.last ? fmt(d.stats.last) : "—";

    const feed = $("feed"), slot = $("empty-slot");
    feed.textContent = ""; slot.textContent = "";
    if (!d.tasks.length) {
      slot.append(el("div", "empty", "还没有记录。给机器人发一条带图片或视频的 x 链接试试。"));
    } else {
      const frag = document.createDocumentFragment();
      for (const t of d.tasks) frag.append(card(t));
      feed.append(frag);
    }
    $("updated").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN");
  } catch (e) {
    $("dot").className = "dot off";
    $("health").textContent = "接口异常：" + e.message;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
