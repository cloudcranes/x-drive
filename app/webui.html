<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-drive · 番号归档</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#000; --panel:rgba(13,13,13,.85); --panel-2:rgba(26,26,26,.85);
    --line:rgba(255,255,255,.10); --line-2:rgba(251,219,163,.22);
    --text:#f8fafc; --muted:#a3b0c2; --dim:#6b7c94;
    --cyan:#3ebaf4; --red:#ef6a6a; --violet:#c9a3ff;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --sans:"Plus Jakarta Sans",-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
    --gap:20px;
    --card-pad:14px;
    --radius-card:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--text); background:var(--bg);
    background-image:
      radial-gradient(760px 460px at 86% -8%, rgba(62,186,244,.16), transparent 68%),
      radial-gradient(620px 420px at 4% 2%, rgba(236,72,153,.07), transparent 70%);
    background-attachment:fixed;
    font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased;
  }

  /* 顶栏 */
  header{
    position:sticky; top:0; z-index:20; backdrop-filter:blur(16px);
    background:rgba(0,0,0,.72); border-bottom:1px solid var(--line);
  }
  .bar{max-width:1440px; margin:0 auto; padding:12px 26px; display:flex; align-items:center; gap:16px}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:-.02em; font-size:17px}
  .brand .mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(62,186,244,.32),rgba(62,186,244,.10));
    border:1px solid rgba(62,186,244,.4)}
  .brand .mark svg{width:13px;height:13px;stroke:var(--cyan)}
  .brand i{font-style:normal; color:var(--cyan)}
  .search{display:flex; align-items:center; gap:8px; min-width:0; flex:1; max-width:620px}
  .search input{flex:1; min-width:120px; padding:8px 12px; border-radius:8px; font-size:13px;
    border:1px solid var(--line); background:rgba(13,13,13,.85); color:var(--text); outline:none;
    transition:border-color .16s, box-shadow .16s}
  .search input::placeholder{color:#4a5566}
  .search input:focus{border-color:rgba(62,186,244,.55); box-shadow:0 0 0 3px rgba(62,186,244,.12)}
  .chipbtn{font-family:var(--mono); font-size:11.5px; padding:6px 11px; border-radius:999px;
    border:1px solid var(--line); background:rgba(13,13,13,.85); color:var(--muted); cursor:pointer;
    transition:color .16s, border-color .16s, background .16s; white-space:nowrap}
  .chipbtn:hover{color:var(--text); border-color:rgba(255,255,255,.2)}
  .chipbtn.on{color:var(--cyan); border-color:rgba(62,186,244,.5); background:rgba(62,186,244,.10)}
  .chipbtn.primary{color:#04140d; background:linear-gradient(150deg,var(--cyan),#2b9fd0);
    border-color:transparent; font-weight:700}
  .chipbtn.primary:hover{filter:brightness(1.08)}
  .panel{max-width:1440px; margin:18px auto 0; padding:16px 18px; border:1px solid var(--line);
    border-radius:12px; background:rgba(13,13,13,.85)}
  .panel[hidden]{display:none}
  .panel label{display:block; font-size:12px; color:var(--muted); margin-bottom:8px}
  .panel textarea{width:100%; resize:vertical; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); background:rgba(0,0,0,.55); color:var(--text);
    font-family:var(--mono); font-size:12.5px; outline:none}
  .panel textarea:focus{border-color:rgba(62,186,244,.55); box-shadow:0 0 0 3px rgba(62,186,244,.12)}
  .panel-actions{display:flex; align-items:center; gap:10px; margin-top:10px}
  .panel .hint{font-family:var(--mono); font-size:11.5px; color:var(--dim)}
  .preview{margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    display:flex; gap:14px; align-items:flex-start}
  .preview[hidden]{display:none}
  .preview .meta{flex:1; min-width:0}
  .preview .meta b{display:block; font-size:13.5px; font-weight:700; margin-bottom:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .preview .meta span{font-family:var(--mono); font-size:11.5px; color:var(--dim)}
  .shots{display:flex; gap:6px; overflow:hidden}
  .shots img{width:96px; height:54px; object-fit:cover; border-radius:6px;
    border:1px solid var(--line); background:#0a0a0a}
  .jobs{max-width:1440px; margin:16px auto 0; padding:0 26px; display:flex; flex-direction:column; gap:8px}
  .jobs:empty{display:none}
  .job{display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--line);
    border-radius:8px; background:rgba(13,13,13,.7); font-family:var(--mono); font-size:12px}
  .job .st{min-width:74px; color:var(--cyan)}
  .job .bar{flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden}
  .job .bar i{display:block; height:100%; background:var(--cyan); width:0; transition:width .3s}
  .job .txt{color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .job.failed .st{color:#ff8a8a}
  .job.done .st{color:#5fd38d}
  .refresh{margin-left:auto; width:32px; height:32px; padding:0; display:grid; place-items:center;
    border-radius:8px; border:1px solid var(--line); background:rgba(13,13,13,.85);
    color:var(--muted); cursor:pointer; transition:color .16s, border-color .16s, background .16s}
  .refresh:hover{color:var(--cyan); border-color:rgba(62,186,244,.45); background:rgba(62,186,244,.08)}
  .refresh svg{width:15px; height:15px}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge{ display:inline-flex; align-items:center; gap:7px; padding:5px 11px;
    border:1px solid var(--line); border-radius:999px; background:rgba(13,13,13,.85);
    font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}

  /* hero + 统计 */
  .hero{max-width:1440px; margin:0 auto; padding:38px 26px 0}
  .eyebrow{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--cyan); display:flex; align-items:center; gap:7px}
  .eyebrow::before{content:""; width:5px;height:5px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 10px var(--cyan)}
  h1{font-size:36px; letter-spacing:-.025em; margin:12px 0 8px; font-weight:800; line-height:1.15;
    background:linear-gradient(120deg,#f8fafc 0%,#f8fafc 34%,var(--cyan) 52%,#f8fafc 70%,#f8fafc 100%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 7s linear infinite}
  @keyframes shine{from{background-position:130% 0}to{background-position:-30% 0}}
  .desc{color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 22px; max-width:620px}

  .capsule{display:inline-grid; grid-template-columns:repeat(4,auto); border-radius:20px; padding:14px 8px;
    border:1px solid var(--line-2); background:linear-gradient(135deg,rgba(26,26,26,.85),rgba(10,10,10,.9));
    box-shadow:0 0 18px -2px rgba(92,182,206,.28)}
  .metric{padding:0 22px; border-right:1px solid var(--line)}
  .metric:last-child{border-right:0}
  .metric b{display:block; font-family:var(--mono); font-size:21px; font-weight:800;
    letter-spacing:-.02em; line-height:1.3; font-variant-numeric:tabular-nums}
  .metric span{font-size:11px; color:var(--dim); letter-spacing:.05em}

  /* 瀑布流：CSS columns，卡片 break-inside:avoid 保证不被拆断 */
  .groups{max-width:1440px; margin:0 auto; padding:0 26px; display:flex; flex-wrap:wrap;
    gap:8px; align-items:center}
  .groups .lbl{font-family:var(--mono); font-size:10.5px; color:var(--dim); letter-spacing:.08em;
    text-transform:uppercase; margin-right:4px}
  .groups .sep{width:1px; height:18px; background:var(--line); margin:0 6px}
  .feed{max-width:1440px; margin:0 auto; padding:28px 26px 72px; column-gap:var(--gap); column-count:4}
  @media(max-width:1320px){.feed{column-count:3}}
  @media(max-width:960px){.feed{column-count:2} :root{--gap:16px}}
  @media(max-width:620px){
    .feed{column-count:1; padding:20px 14px 56px}
    .hero{padding:26px 14px 0} .bar{padding:10px 14px}
    h1{font-size:28px}
    .capsule{display:grid; grid-template-columns:1fr 1fr; width:100%; row-gap:14px; padding:16px 6px}
    .metric{padding:0 14px}
    .metric:nth-child(2n){border-right:0}
    .metric:nth-child(n+3){padding-top:2px}
    :root{--card-pad:12px}
  }

  .card{break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
    margin:0 0 var(--gap); border:1px solid var(--line); border-radius:var(--radius-card);
    background:linear-gradient(180deg,rgba(20,20,20,.9) 0%,rgba(11,11,11,.92) 100%);
    overflow:hidden; box-shadow:0 6px 20px -12px rgba(0,0,0,.9);
    transition:border-color .2s, box-shadow .2s, transform .2s}
  .card:hover .title{color:#fff}
  .card:hover{border-color:rgba(62,186,244,.4); transform:translateY(-3px);
    box-shadow:0 18px 34px -20px rgba(0,0,0,.95), 0 0 24px -12px rgba(62,186,244,.5)}
  .card-media{position:relative; overflow:hidden; aspect-ratio:16/10;
    background:
      radial-gradient(420px 200px at 88% -20%, rgba(62,186,244,.16), transparent 70%),
      linear-gradient(135deg, rgba(26,26,26,.9), rgba(10,10,10,.95))}
  .codebox{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
    align-items:center; gap:10px; padding:18px; text-align:center}
  .code{font-family:var(--mono); font-size:clamp(18px, 2.4vw, 30px); font-weight:800;
    letter-spacing:-.01em; line-height:1.15; word-break:break-all; color:var(--text);
    text-shadow:0 0 22px rgba(62,186,244,.28)}


  /* 多图宫格：2 图左右分栏，3 图左大右两小，4 图四宫格 */
  .grid{display:grid; gap:2px; background:#0a0a0a; height:100%}
  .grid.n2{grid-template-columns:1fr 1fr}
  .grid.n3{grid-template-columns:1.35fr 1fr; grid-template-rows:1fr 1fr}
  .grid.n4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
  .grid .cell{position:relative; overflow:hidden; min-height:0}
  .grid.n3 .cell:first-child{grid-row:span 2}
  .grid img{width:100%; height:100%; object-fit:cover; display:block}
  .grid .ph{aspect-ratio:auto; height:100%}
  /* 视频播放器 */
  .vwrap{position:relative; background:#080808; line-height:0; aspect-ratio:4/3; overflow:hidden}
  .vwrap video{width:100%; height:100%; object-fit:contain; display:block; background:#000}
  .vwrap .poster{object-fit:cover}
  .vwrap .poster{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .vwrap.playing .poster{display:none}
  .vwrap.compact{aspect-ratio:auto; height:100%}
  .playbtn{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:54px; height:54px; border-radius:50%; cursor:pointer;
    border:1px solid rgba(255,255,255,.4); background:rgba(8,8,8,.62);
    color:#fff; font-size:15px; backdrop-filter:blur(8px);
    display:grid; place-items:center; transition:transform .18s, background .18s, border-color .18s;
    box-shadow:0 8px 24px -10px rgba(0,0,0,.9); padding-left:3px}
  .playbtn:hover{transform:translate(-50%,-50%) scale(1.06); background:rgba(62,186,244,.35)}
  .playbtn.bad{width:auto; height:30px; padding:0 12px; border-radius:6px; font-size:11px;
    font-family:var(--mono)}
  .vwrap.playing video{position:relative; z-index:2}
  .vwrap.playing .playbtn{display:none !important}
  .vwrap.compact .playbtn{width:34px; height:34px; font-size:12px}
  .cellplay{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
    background:rgba(0,0,0,.6); border:1px solid var(--line); color:#fff; font-size:10px}
  .badge-media{position:absolute; left:10px; top:10px; display:flex; gap:6px; z-index:3}
  .chip{font-family:var(--mono); font-size:10.5px; padding:3px 7px; border-radius:999px;
    background:rgba(0,0,0,.78); border:1px solid rgba(255,255,255,.14); color:var(--text);
    backdrop-filter:blur(8px); letter-spacing:.02em}
  .chip.img{color:var(--cyan); border-color:rgba(62,186,244,.4)}
  .chip.vid{color:var(--violet); border-color:rgba(201,163,255,.36)}
  .more{position:absolute; right:9px; bottom:9px; font-family:var(--mono); font-size:10.5px;
    padding:3px 7px; border-radius:5px; background:rgba(0,0,0,.72); border:1px solid var(--line);
    color:var(--muted)}

  .card-body{padding:var(--card-pad) var(--card-pad) calc(var(--card-pad) - 1px)}
  .who{display:flex; align-items:center; gap:8px; margin-bottom:9px; min-width:0}
  .avatar{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(62,186,244,.34),rgba(236,72,153,.26));
    border:1px solid rgba(255,255,255,.16); font-family:var(--mono); font-size:10.5px;
    font-weight:700; color:var(--text); letter-spacing:0}
  .who .name{font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who .handle{color:var(--dim); font-family:var(--mono); font-size:11px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .title{font-size:13.5px; color:#dbe2ec; margin:0 0 11px; line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    overflow-wrap:anywhere}
  .meta{display:flex; align-items:center; gap:9px; padding-top:10px; border-top:1px solid rgba(255,255,255,.07);
    font-family:var(--mono); font-size:10.5px; color:var(--dim)}
  .meta .sp{flex:1}
  .meta a{color:var(--cyan); text-decoration:none; font-weight:600; letter-spacing:.01em;
    padding:1px 0; border-radius:4px}
  .meta a:hover{text-decoration:underline}

  .empty{max-width:1440px; margin:0 auto 60px; padding:34px 20px; color:var(--muted);
    border:1px dashed var(--line); border-radius:8px; text-align:center}
  footer{max-width:1440px; margin:0 auto; padding:0 26px 40px; color:var(--dim);
    font-family:var(--mono); font-size:11.5px; display:flex; justify-content:space-between;
    gap:14px; flex-wrap:wrap}

  /* 灯箱 */
  .lightbox{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92);
    display:grid; place-items:center; backdrop-filter:blur(6px)}
  .lightbox[hidden]{display:none !important}
  .lb-stage{max-width:min(92vw,1200px); max-height:86vh; display:grid; place-items:center}
  .lb-stage img,.lb-stage video{max-width:100%; max-height:86vh; border-radius:10px;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
  .lb-close,.lb-nav{position:absolute; border:1px solid var(--line); background:rgba(13,13,13,.85);
    color:var(--text); cursor:pointer; border-radius:10px; width:40px; height:40px;
    display:grid; place-items:center; font-size:16px}
  .lb-close{right:20px; top:20px}
  .lb-nav.prev{left:18px; top:50%; transform:translateY(-50%)}
  .lb-nav.next{right:18px; top:50%; transform:translateY(-50%)}
  .lb-nav[hidden]{visibility:hidden}
  .lb-count{position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font-family:var(--mono); font-size:12px; color:var(--muted)}
  .card-media{cursor:pointer}

  @media(prefers-reduced-motion:reduce){h1{animation:none} .card{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v11"/><path d="m7.5 11.5 4.5 4 4.5-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </span>
      x-<i>drive</i>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索番号 / 来源   ( / )" autocomplete="off">
      <button class="chipbtn" id="f-all" data-filter="all" type="button">全部</button>
      <button class="chipbtn" data-filter="single" type="button">单文件</button>
      <button class="chipbtn" data-filter="multi" type="button">多文件</button>
    </div>
    <button class="chipbtn primary" id="new-task" type="button">+ 新建下载</button>
    <button class="refresh" id="refresh" type="button" title="立即刷新" aria-label="立即刷新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
    <div class="badge"><span class="dot" id="dot"></span><span id="health">连接中…</span></div>
    <button class="refresh" id="logout" type="button" title="退出登录" aria-label="退出登录" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/>
        <path d="M21 12H9"/>
      </svg>
    </button>
  </div>
</header>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" type="button" aria-label="关闭">✕</button>
  <button class="lb-nav prev" id="lb-prev" type="button" aria-label="上一张">‹</button>
  <div class="lb-stage" id="lb-stage"></div>
  <button class="lb-nav next" id="lb-next" type="button" aria-label="下一张">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>

<main>
  <section class="hero">
    <div class="eyebrow">Number Archive</div>
    <h1>番号归档库</h1>
    <p class="desc">发给机器人的磁力或直链会按番号建目录上传到 Google Drive，这里按归档时间倒序排列。</p>
    <div class="capsule">
      <div class="metric"><b id="s-tasks">0</b><span>已归档番号</span></div>
      <div class="metric"><b id="s-images">0</b><span>文件数</span></div>
      <div class="metric"><b id="s-videos">0</b><span>总容量</span></div>
      <div class="metric"><b id="s-last">—</b><span>最近归档</span></div>
    </div>
  </section>

  <section class="panel" id="panel" hidden>
    <label for="dl-text">磁力或直链（可带番号，如 <code>SSIS-123 magnet:?xt=...</code>）</label>
    <textarea id="dl-text" rows="3" placeholder="magnet:?xt=urn:btih:..."></textarea>
    <div class="panel-actions">
      <button class="chipbtn primary" id="dl-submit" type="button">开始下载</button>
      <button class="chipbtn" id="dl-peek" type="button">预览信息</button>
      <button class="chipbtn" id="dl-cancel" type="button">取消</button>
      <span class="hint" id="dl-hint"></span>
    </div>
    <div class="preview" id="dl-preview" hidden></div>
  </section>

  <section class="jobs" id="jobs"></section>

  <section class="groups" id="groups"></section>
  <section class="feed" id="feed"></section>
  <div id="empty-slot"></div>
  <footer>
    <span>parse-video-py · rclone · python-telegram-bot</span>
    <span id="updated"></span>
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = iso => {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso.slice(0, 16).replace("T", " ");
  return d.toLocaleString("zh-CN", {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
};
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const initial = s => (s || "?").trim().charAt(0).toUpperCase() || "?";

/** 一条归档 = 一张番号卡片 */
function card(t) {
  const node = el("article", "card");
  const media = el("div", "card-media");
  const box = el("div", "codebox");
  box.append(el("span", "code", t.code));
  const chips = el("div", "badge-media");
  chips.append(el("span", "chip img", t.count + " 文件"));
  chips.append(el("span", "chip vid", t.size_text));
  box.append(chips);
  media.append(box);
  node.append(media);

  const body = el("div", "card-body");
  const meta = el("div", "meta");
  meta.append(el("span", null, fmt(t.at)));
  meta.append(el("span", "sp"));
  if (t.link) {
    const drv = el("a", null, "Drive ↗");
    drv.href = t.link;
    drv.target = "_blank";
    drv.rel = "noopener";
    meta.append(drv);
  } else {
    meta.append(el("span", null, "未取到链接"));
  }
  body.append(meta);
  node.append(body);

  node.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    if (t.link) window.open(t.link, "_blank", "noopener");
  });
  return node;
}

// 若通过 http://user:pass@host 打开，浏览器会把凭据留在 location，
// 直接 fetch 相对地址会抛 "URL that includes credentials"。这里取出凭据并抹掉地址栏。
const BASE = location.origin;
const AUTH_HEADER = (() => {
  const m = location.href.match(/^(https?:\/\/)([^/@]+)@/);
  if (!m) return null;
  const creds = m[2];
  try { history.replaceState(null, "", location.href.replace(m[0], m[1])); } catch (e) {}
  try { return "Basic " + btoa(decodeURIComponent(creds)); } catch (e) { return null; }
})();

// 搜索与筛选状态
const view = {q: "", kind: "all", author: "", month: ""};
const allTasks = new Map();     // id -> task（供过滤时复用）

function matches(t) {
  if (view.kind === "single" && t.count !== 1) return false;
  if (view.kind === "multi" && t.count < 2) return false;
  if (view.author && (t.code || "").split("-")[0] !== view.author) return false;
  const q = view.q.trim().toLowerCase();
  if (!q) return true;
  return [t.code, t.source, t.path].some(v => (v || "").toLowerCase().includes(q));
}

function renderGroups() {
  const box = $("groups");
  box.textContent = "";
  const byPrefix = new Map();
  const byMonth = new Map();
  for (const t of allTasks.values()) {
    const prefix = (t.code || "").split("-")[0] || "其他";
    byPrefix.set(prefix, (byPrefix.get(prefix) || 0) + 1);
    const month = (t.at || "").slice(0, 7);
    if (month) byMonth.set(month, (byMonth.get(month) || 0) + 1);
  }
  const make = (label, entries, kind) => {
    const frag = document.createDocumentFragment();
    if (!entries.length) return frag;
    frag.append(el("span", "lbl", label));
    for (const [key, count] of entries) {
      const b = el("button", "chipbtn", kind === "month" ? key : `${key} ${count}`);
      b.type = "button";
      b.dataset.group = kind;
      b.dataset.key = key;
      if (kind === "author" && view.author === key) b.classList.add("on");
      if (kind === "month" && view.month === key) b.classList.add("on");
      frag.append(b);
    }
    return frag;
  };
  box.append(make("系列", [...byPrefix.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8), "author"));
  if (byPrefix.size) box.append(el("span", "sep"));
  box.append(make("月份", [...byMonth.entries()].sort((a, b) => (a[0] < b[0] ? 1 : -1)).slice(0, 6), "month"));
  box.onclick = e => {
    const btn = e.target.closest("button[data-group]");
    if (!btn) return;
    if (btn.dataset.group === "author") view.author = view.author === btn.dataset.key ? "" : btn.dataset.key;
    else view.month = view.month === btn.dataset.key ? "" : btn.dataset.key;
    renderGroups();
    applyFilter();
  };
}

function applyFilter() {
  const tasks = [...allTasks.values()].filter(matches);
  syncFeed(tasks);
  $("empty-slot").textContent = "";
  if (!tasks.length && allTasks.size) {
    $("feed").textContent = "";
    $("empty-slot").append(el("div", "empty", "没有匹配的记录，换个关键词试试。"));
  }
}

// 灯箱
const lb = { items: [], i: 0 };
function openLightbox(items, index, title) {
  lb.items = items; lb.i = index || 0;
  $("lightbox").hidden = false;
  renderLightbox(title || "");
}
function renderLightbox(title) {
  const stage = $("lb-stage");
  stage.textContent = "";
  const item = lb.items[lb.i];
  if (!item) return;
  if (item.kind === "video") {
    const v = document.createElement("video");
    v.src = abs(item.play || item.raw);
    v.controls = true; v.autoplay = true; v.playsInline = true;
    stage.append(v);
  } else {
    const img = new Image();
    img.src = abs(item.full || item.raw || item.thumb);
    img.alt = title;
    img.referrerPolicy = "no-referrer";
    stage.append(img);
  }
  $("lb-count").textContent = `${lb.i + 1} / ${lb.items.length}` + (title ? " · " + title.slice(0, 40) : "");
  $("lb-prev").hidden = lb.i === 0;
  $("lb-next").hidden = lb.i >= lb.items.length - 1;
}
function closeLightbox() {
  $("lightbox").hidden = true;
  $("lb-stage").textContent = "";
}
$("lb-close").addEventListener("click", closeLightbox);
$("lb-prev").addEventListener("click", () => { if (lb.i > 0) { lb.i--; renderLightbox(""); } });
$("lb-next").addEventListener("click", () => { if (lb.i < lb.items.length - 1) { lb.i++; renderLightbox(""); } });
$("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLightbox(); });
document.addEventListener("keydown", e => {
  if ($("lightbox").hidden) {
    if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
      e.preventDefault(); $("q").focus();
    }
    return;
  }
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft" && lb.i > 0) { lb.i--; renderLightbox(""); }
  if (e.key === "ArrowRight" && lb.i < lb.items.length - 1) { lb.i++; renderLightbox(""); }
});

// 输入与筛选按钮
let qTimer = null;
$("q").addEventListener("input", e => {
  view.q = e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(applyFilter, 180);
});
for (const btn of document.querySelectorAll(".chipbtn")) {
  if (btn.dataset.filter === "all") btn.classList.add("on");
  btn.addEventListener("click", () => {
    for (const b of document.querySelectorAll(".chipbtn")) b.classList.toggle("on", b === btn);
    view.kind = btn.dataset.filter;
    applyFilter();
  });
}

// 增量渲染：按 id 复用已有卡片，避免轮询把正在播放的视频掐掉、把滚动位置重置
const mounted = new Map();   // id -> {node, at, sig}
let inflight = null;

function signature(t) {
  return [t.at, t.title, t.files.join("|"), t.link].join("~");
}

function syncFeed(tasks) {
  const feed = $("feed"), slot = $("empty-slot");
  slot.textContent = "";
  if (!tasks.length) {
    feed.textContent = "";
    mounted.clear();
    slot.append(el("div", "empty", "还没有记录。给机器人发一条带图片或视频的 x 链接试试。"));
    return;
  }

  const seen = new Set();
  let anchor = null;
  for (const t of tasks) {
    seen.add(t.id);
    const sig = signature(t);
    const cur = mounted.get(t.id);
    if (cur && cur.sig === sig) { anchor = cur.node; continue; }   // 内容没变，原样保留
    const node = card(t);
    if (cur) { cur.node.replaceWith(node); mounted.set(t.id, {node, sig}); }
    else { mounted.set(t.id, {node, sig}); }
    anchor = node;
  }

  // 按顺序重排：只移动位置不对的节点，已就位的元素（含播放中的 video）不重新插入
  let cursor = feed.firstElementChild;
  for (const t of tasks) {
    const node = mounted.get(t.id).node;
    if (node === cursor) { cursor = cursor.nextElementSibling; }
    else { feed.insertBefore(node, cursor); }
  }

  for (const [id, item] of [...mounted]) {
    if (!seen.has(id)) { item.node.remove(); mounted.delete(id); }
  }
}

async function load() {
  if (inflight) return inflight;              // 防止定时器与手动刷新叠在一起
  inflight = (async () => {
    try {
      const init = {cache: "no-store"};
      if (AUTH_HEADER) init.headers = {Authorization: AUTH_HEADER};
      const r = await fetch(BASE + "/api/tasks", init);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      $("dot").className = d.health.parse ? "dot" : "dot off";
      $("health").textContent = `运行中 · ${d.stats.tasks} 个番号`;
      $("s-tasks").textContent = d.stats.tasks;
      $("s-images").textContent = d.stats.files;
      $("s-videos").textContent = d.stats.size_text || "0MB";
      $("s-last").textContent = d.stats.last ? fmt(d.stats.last) : "—";
      allTasks.clear();
      for (const t of d.tasks) allTasks.set(t.id, t);
      renderGroups();
      applyFilter();
      $("updated").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN");
      $("refresh").classList.remove("spin");
    } catch (e) {
      // 失败时保留现有列表，只提示状态；不再清空页面
      $("dot").className = "dot off";
      $("health").textContent = "刷新失败：" + e.message + "（显示的是上次结果）";
      $("refresh").classList.remove("spin");
    } finally {
      inflight = null;
    }
  })();
  return inflight;
}

$("logout").addEventListener("click", async () => {
  try { await fetch(BASE + "/api/logout", {method: "POST", cache: "no-store"}); } catch (e) {}
  location.replace("/");
});

// ── 新建下载
$("new-task").addEventListener("click", () => {
  const panel = $("panel");
  panel.hidden = !panel.hidden;
  if (!panel.hidden) $("dl-text").focus();
});
$("dl-cancel").addEventListener("click", () => { $("panel").hidden = true; $("dl-hint").textContent = ""; });

function showPreview(info) {
  const box = $("dl-preview");
  if (!info) { box.hidden = true; return; }
  box.textContent = "";
  const meta = el("div", "meta");
  meta.append(el("b", null, info.name || "未命名"));
  const size = info.size ? (info.size / 1073741824 >= 1
    ? (info.size / 1073741824).toFixed(2) + "GB"
    : (info.size / 1048576).toFixed(0) + "MB") : "—";
  meta.append(el("span", null, [size, info.count ? info.count + " 个文件" : "", info.file_type].filter(Boolean).join(" · ")));
  box.append(meta);
  const shots = el("div", "shots");
  for (const src of (info.screenshots || []).slice(0, 4)) {
    const img = new Image();
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.src = BASE + "/proxy?u=" + encodeURIComponent(src);
    shots.append(img);
  }
  if (shots.childElementCount) box.append(shots);
  box.hidden = false;
}

$("dl-peek").addEventListener("click", async () => {
  const text = $("dl-text").value.trim();
  const magnet = (text.match(/magnet:\?[^\s"']+/) || [""])[0];
  if (!magnet) { $("dl-hint").textContent = "先粘贴磁力链接"; return; }
  $("dl-peek").disabled = true;
  $("dl-hint").textContent = "查询中…";
  try {
    const init = {cache: "no-store"};
    if (AUTH_HEADER) init.headers = {Authorization: AUTH_HEADER};
    const r = await fetch(BASE + "/api/peek?magnet=" + encodeURIComponent(magnet), init);
    const d = await r.json();
    if (r.ok && d.info) {
      showPreview(d.info);
      $("dl-hint").textContent = "已获取磁力信息";
    } else {
      $("dl-hint").textContent = "查不到信息（磁力可能无人做种或格式不完整）";
    }
  } catch (e) {
    $("dl-hint").textContent = "查询失败：" + e.message;
  } finally {
    $("dl-peek").disabled = false;
  }
});

$("dl-submit").addEventListener("click", async () => {
  const text = $("dl-text").value.trim();
  if (!text) { $("dl-hint").textContent = "先粘贴磁力或直链"; return; }
  $("dl-submit").disabled = true;
  $("dl-hint").textContent = "提交中…";
  try {
    const init = {method: "POST", cache: "no-store",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text})};
    if (AUTH_HEADER) init.headers.Authorization = AUTH_HEADER;
    const r = await fetch(BASE + "/api/download", init);
    const d = await r.json();
    if (r.ok && d.ok) {
      $("dl-hint").textContent = `已提交 ${d.count} 个任务` + (d.code ? ` · 番号 ${d.code}` : "");
      if (d.preview) showPreview(d.preview);
      $("dl-text").value = "";
      loadJobs();
    } else {
      $("dl-hint").textContent = d.error || "提交失败";
    }
  } catch (e) {
    $("dl-hint").textContent = "提交失败：" + e.message;
  } finally {
    $("dl-submit").disabled = false;
  }
});

// ── 任务进度
const STAGE_TEXT = {queued: "排队", downloading: "下载", organizing: "整理", uploading: "上传", done: "完成", failed: "失败"};

async function loadJobs() {
  try {
    const init = {cache: "no-store"};
    if (AUTH_HEADER) init.headers = {Authorization: AUTH_HEADER};
    const r = await fetch(BASE + "/api/jobs", init);
    if (!r.ok) return;
    const {jobs} = await r.json();
    const box = $("jobs");
    box.textContent = "";
    for (const j of jobs) {
      const node = el("div", "job " + (j.stage === "failed" ? "failed" : j.stage === "done" ? "done" : ""));
      node.append(el("span", "st", STAGE_TEXT[j.stage] || j.stage));
      const bar = el("div", "bar");
      const fill = el("i");
      fill.style.width = (j.percent || 0) + "%";
      bar.append(fill);
      node.append(bar);
      const speed = j.speed ? (j.speed / 1048576).toFixed(1) + "MB/s" : "";
      const label = j.code || j.name || (j.source || "").slice(0, 42);
      node.append(el("span", "txt", [label, speed, j.error].filter(Boolean).join(" · ")));
      if (j.link) {
        const a = el("a", null, "Drive ↗");
        a.href = j.link; a.target = "_blank"; a.rel = "noopener";
        node.append(a);
      }
      box.append(node);
    }
  } catch (e) { /* 静默 */ }
}

$("refresh").addEventListener("click", () => {
  $("refresh").classList.add("spin");
  load();
});
load();
loadJobs();
setInterval(load, 30000);
setInterval(loadJobs, 3000);

// 有会话时展示退出入口；401 说明会话过期，直接回登录页
fetch(BASE + "/api/session", {cache: "no-store"})
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d) { location.replace("/"); return; }
    $("logout").hidden = !d.auth;
  })
  .catch(() => {});
</script>
