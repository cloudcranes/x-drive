// CloudDrive2 gRPC 接口定义（原样取自官方发布、经 python-clouddrive2 分发的那一份）。
//
// 来源：https://github.com/iLay1678/python-clouddrive2 → clouddrive/proto/CloudDrive.proto
//       （与 CloudDrive2 官方 gRPC 指南 v1.1.x 对应；官方仓库只发布生成的文档）
// 用途：生成 app/storage/proto/CloudDrive_pb2.py，供 app/storage/cd2_grpc.py 拼消息。
// 维护：CD2 升级导致字段变化时重跑 scripts/gen-cd2-proto.sh 并提交生成结果。
// 注意：这里只 vendor 了 .proto 与 pb2；官方的 _pb2_grpc.py（319KB、带 grpc 版本断言）
//       没有带进来，方法桩在 cd2_grpc.py 里自己写（不到 40 行）。

syntax = "proto3";
package clouddrive;

option csharp_namespace = "CloudDriveSrv.Protos";

import "google/protobuf/descriptor.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

extend google.protobuf.FileOptions {
  string version = 50001;
}

option (version) = "2.1.0.0-beta";

service CloudDriveFileSrv {
